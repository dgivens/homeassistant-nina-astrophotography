name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  unit:
    name: Unit suite (HA-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # -p no:homeassistant makes the runtime half of the seam guard meaningful
      # as a secondary; tests/unit/test_seam.py is the real check.
      - run: uv run coverage run -m pytest tests/unit -p no:homeassistant -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.*
          include-hidden-files: true

  ha:
    name: Home Assistant suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `test_entity_resolver.py` runs the shipped Lovelace resolver module
      # itself, so it needs node. Declared rather than relied on: the runner
      # image happens to carry one, and those tests SKIP without it — which
      # would be a green CI over a card nothing had checked.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --group test-ha
      # No -n auto: pytest-socket is active under PHACC and the push path
      # creates tasks outside the test's control.
      - run: uv run coverage run -m pytest tests/ha -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-ha
          path: .coverage.*
          include-hidden-files: true

  coverage:
    name: Coverage floors
    needs: [unit, ha]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv sync --group test-ha
      - run: uv run coverage combine
      - run: uv run coverage json
      - run: uv run python scripts/coverage_floors.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run --group dev ruff check --output-format=github .
      - run: uv run --group dev ruff format --check .

  typecheck:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # test-ha is what installs `homeassistant`; the paths and rules checked
      # are [tool.pyright] in pyproject.toml.
      - run: uv sync --group dev --group test-ha
      - run: uv run --group dev --group test-ha pyright

  fixtures:
    name: Fixture redaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/check_fixtures.py tests/fixtures/*.json

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

repos:
  - repo: local
    hooks:
      # Through uv, so the hook runs the ruff version uv.lock pins.
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: fixture-redaction
        name: fixtures carry no unredacted secrets
        entry: uv run python scripts/check_fixtures.py
        language: system
        files: ^tests/fixtures/.*\.json$
        pass_filenames: true

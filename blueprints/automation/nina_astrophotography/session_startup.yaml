blueprint:
  name: "N.I.N.A. – Session Startup"
  description: >
    Unparks the mount, optionally opens the dome, cools the camera, and then
    loads and starts a sequence.

    The safety monitor is checked before anything opens: the abort blueprint
    fires on the TRANSITION to unsafe, so a roof opened into conditions that
    are already unsafe is never closed again by it.

    The sequence is named, not a path: the API loads a sequence by the name
    N.I.N.A. lists it under.
  domain: automation
  author: dgivens
  source_url: https://github.com/dgivens/homeassistant-nina-astrophotography/blob/main/blueprints/automation/nina_astrophotography/session_startup.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        nina_rig:
          name: N.I.N.A. instance
          selector:
            device:
              integration: nina_astrophotography
        safety_unsafe:
          name: Unsafe conditions
          description: >
            The rig's "Unsafe" sensor — ON when conditions are unsafe. Nothing
            opens or starts unless this reads off.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: safety

    schedule:
      name: Schedule
      icon: mdi:clock-outline
      input:
        trigger_time:
          name: Start time
          default: "21:00:00"
          selector:
            time:

    settings:
      name: Settings
      icon: mdi:cog
      input:
        camera_target_temp:
          name: Camera target temperature
          default: -10
          selector:
            number:
              min: -30
              max: 0
              unit_of_measurement: "°C"
        cooling_ramp_minutes:
          name: Cooling ramp time
          description: Minutes over which N.I.N.A. ramps the sensor to target.
          default: 15
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min
        cooling_wait_minutes:
          name: Wait after cooling
          description: Extra settling time before the sequence starts.
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: min
        open_dome:
          name: Open the dome
          default: false
          selector:
            boolean:
        sequence_name:
          name: Sequence name
          description: >
            The sequence's name as N.I.N.A. lists it, without the
            .ninasequence extension. Leave blank to start whatever is loaded.
          default: ""
          selector:
            text:
        notify_target:
          name: Notify
          description: Notify entities to alert. Leave empty for none.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true

mode: single
max_exceeded: silent

# Inputs must be bound here before templates can reference them.
variables:
  cooling_ramp_minutes: !input cooling_ramp_minutes
  cooling_wait_minutes: !input cooling_wait_minutes
  nina_rig: !input nina_rig
  safety_unsafe: !input safety_unsafe
  sequence_name: !input sequence_name

triggers:
  - trigger: time
    at: !input trigger_time

conditions:
  # Nothing opens into conditions that are already unsafe. `unknown` and
  # `unavailable` count as unsafe: an unread monitor is not a safe one.
  - alias: "Conditions are safe"
    condition: state
    entity_id: !input safety_unsafe
    state: "off"
  # Selectors cannot cross-filter, so the entity and the device above can name
  # different rigs. Only blocks when they positively disagree.
  - alias: "The entity and the device name the same rig"
    condition: template
    value_template: >
      {% set entry = config_entry_id(safety_unsafe) %}
      {% set rig = device_attr(nina_rig, 'config_entries') %}
      {{ entry is none or rig is not iterable or entry in rig | list }}

actions:
  # Tracking is deliberately not enabled here: N.I.N.A.'s own slew enables it,
  # and a mount tracking from the park position for twenty minutes drifts
  # toward a pier limit on some mounts.
  - alias: "Unpark the mount"
    action: nina_astrophotography.mount_unpark
    target:
      device_id: !input nina_rig

  - alias: "Open the dome"
    action: nina_astrophotography.dome_open
    target:
      device_id: !input nina_rig
    enabled: !input open_dome

  - alias: "Start the camera cooling"
    action: nina_astrophotography.camera_cool
    target:
      device_id: !input nina_rig
    data:
      temperature: !input camera_target_temp
      minutes: !input cooling_ramp_minutes

  - alias: "Wait out the cooling ramp, plus the settling time"
    delay:
      minutes: "{{ cooling_ramp_minutes | int + cooling_wait_minutes | int }}"

  - alias: "Re-check that conditions are still safe"
    condition: state
    entity_id: !input safety_unsafe
    state: "off"

  - alias: "Load the sequence, if one was named"
    if:
      - condition: template
        value_template: "{{ sequence_name != '' }}"
    then:
      - action: nina_astrophotography.sequence_load
        target:
          device_id: !input nina_rig
        data:
          sequence_name: !input sequence_name
      # A large Target Scheduler tree takes a while to deserialize.
      - delay: "00:00:10"

  - alias: "Start the sequence"
    action: nina_astrophotography.sequence_start
    target:
      device_id: !input nina_rig

  - alias: "Notify that the session has started"
    action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: "🔭 N.I.N.A. session started"
      message: "The imaging sequence has been started."
    continue_on_error: true

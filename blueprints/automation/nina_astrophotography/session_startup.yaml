blueprint:
  name: "N.I.N.A. – Session Startup"
  description: >
    Performs a full observatory startup routine at a configurable time or trigger.
    Unparks the mount, enables tracking, cools the camera to a target temperature,
    optionally opens the dome, and then loads and starts an imaging sequence.
  domain: automation
  source_url: https://github.com/christian-photo/ninaAPI
  input:
    nina_device:
      name: N.I.N.A. Instance
      description: Any device belonging to the instance to start up.
      selector:
        device:
          filter:
            - integration: nina_astrophotography

    camera_temp_entity:
      name: Camera Temperature Sensor
      description: Usually sensor.<instance>_camera_temperature. Used in the notification.
      selector:
        entity:
          filter:
            - integration: nina_astrophotography
              domain: sensor

    trigger_time:
      name: Start Time
      description: Time of day to begin the startup routine.
      default: "21:00:00"
      selector:
        time:

    camera_target_temp:
      name: Camera Target Temperature (°C)
      description: Temperature to cool the sensor to before starting.
      default: -10
      selector:
        number:
          min: -30
          max: 0
          unit_of_measurement: "°C"

    cooling_ramp_minutes:
      name: Cooling Ramp Time (minutes)
      description: How many minutes to take to ramp to the target temperature.
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    cooling_wait_minutes:
      name: Wait After Cooling (minutes)
      description: Additional wait after reaching target temp before starting sequence.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: min

    open_dome:
      name: Open Dome
      description: Open the dome shutter before starting.
      default: false
      selector:
        boolean:

    sequence_name:
      name: Sequence Name
      description: >
        Name of the sequence to load from N.I.N.A.'s configured sequence folder.
        This is a name, not a file path — the names come from the
        sequence/list-available endpoint. Leave blank to start whatever is
        already loaded.
      default: ""
      selector:
        text:

    notify_service:
      name: Notification Service (optional)
      description: >
        Notification service to call when the session starts, without the
        leading "notify.". Leave blank to skip.
      default: ""
      selector:
        text:

variables:
  camera_temp_entity: !input camera_temp_entity
  cooling_ramp_minutes: !input cooling_ramp_minutes
  cooling_wait_minutes: !input cooling_wait_minutes
  open_dome: !input open_dome
  sequence_name: !input sequence_name
  notify_service: !input notify_service

trigger:
  - platform: time
    at: !input trigger_time

condition: []

action:
  - alias: "Unpark mount"
    service: nina_astrophotography.mount_unpark
    target:
      device_id: !input nina_device

  - delay: "00:00:05"

  - alias: "Enable sidereal tracking"
    service: nina_astrophotography.mount_set_tracking
    target:
      device_id: !input nina_device
    data:
      mode: Sidereal

  - alias: "Conditionally open dome"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ open_dome }}"
        sequence:
          - service: nina_astrophotography.dome_open
            target:
              device_id: !input nina_device
          - delay: "00:00:30"

  - alias: "Start camera cooling"
    service: nina_astrophotography.camera_cool
    target:
      device_id: !input nina_device
    data:
      temperature: !input camera_target_temp
      minutes: !input cooling_ramp_minutes

  - alias: "Wait for cooling ramp + extra buffer"
    delay:
      minutes: "{{ cooling_ramp_minutes | int + cooling_wait_minutes | int }}"

  - alias: "Load sequence if one was named"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ sequence_name != '' }}"
        sequence:
          - service: nina_astrophotography.sequence_load
            target:
              device_id: !input nina_device
            data:
              sequence_name: !input sequence_name
          - delay: "00:00:03"

  - alias: "Start the sequence"
    service: nina_astrophotography.sequence_start
    target:
      device_id: !input nina_device

  - alias: "Send notification if one was configured"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_service != '' }}"
        sequence:
          - service: "notify.{{ notify_service }}"
            data:
              title: "🔭 N.I.N.A. Session Started"
              message: >
                Imaging sequence started.
                Camera at {{ states(camera_temp_entity) }}°C.

mode: single

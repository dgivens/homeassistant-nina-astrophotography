blueprint:
  name: "N.I.N.A. – Session Shutdown"
  description: >
    A planned end-of-night shutdown: stop the sequence, park the mount, warm the
    camera and optionally close the dome.

    This is the scheduled counterpart to the unsafe-conditions abort, not a
    replacement for it. Every step continues on error, so a mount that refuses
    to park still leaves the camera warming and the dome closing.
  domain: automation
  author: dgivens
  source_url: https://github.com/dgivens/homeassistant-nina-astrophotography/blob/main/blueprints/automation/nina_astrophotography/session_shutdown.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        nina_rig:
          name: N.I.N.A. instance
          selector:
            device:
              integration: nina_astrophotography
        sequence_running_entity:
          name: Sequence running
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: running
        mount_parked_entity:
          name: Mount at park
          description: >
            Used to confirm the mount is parked before the dome closes. A roof
            closing over an unparked telescope is how the mirror gets broken.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor

    schedule:
      name: Schedule
      icon: mdi:clock-outline
      input:
        trigger_time:
          name: Shutdown time
          description: Typically half an hour before dawn.
          default: "05:00:00"
          selector:
            time:
        only_if_sequence_stopped:
          name: Wait for the sequence to finish
          description: >
            Wait up to two hours for the running sequence to end before
            shutting down. It is stopped anyway once that elapses.
          default: true
          selector:
            boolean:

    settings:
      name: Settings
      icon: mdi:cog
      input:
        warming_ramp_minutes:
          name: Camera warming time
          default: 20
          selector:
            number:
              min: 5
              max: 60
              unit_of_measurement: min
        close_dome:
          name: Close the dome
          description: Only after the mount has parked.
          default: false
          selector:
            boolean:
        notify_device:
          name: Notify service
          description: >
            The notify service to send to, without the `notify.` prefix.
            Leave blank for no notification.
          default: ""
          selector:
            text:

mode: single
max_exceeded: silent

# Inputs must be bound here before templates can reference them.
variables:
  mount_parked: !input mount_parked_entity
  notify_device: !input notify_device
  sequence_running: !input sequence_running_entity

triggers:
  - trigger: time
    at: !input trigger_time

actions:
  # `wait_template`, not `wait_for_trigger`: a sequence that has already
  # finished publishes no state change, and this would wait the full timeout.
  - alias: "Wait for the sequence to finish"
    wait_template: "{{ is_state(sequence_running, 'off') }}"
    timeout: "02:00:00"
    continue_on_timeout: true
    enabled: !input only_if_sequence_stopped

  - alias: "Stop the sequence if it is still running"
    if:
      - condition: state
        entity_id: !input sequence_running_entity
        state: "on"
    then:
      - action: nina_astrophotography.sequence_stop
        target:
          device_id: !input nina_rig
        continue_on_error: true
      - delay: "00:00:10"

  - alias: "Park the mount"
    action: nina_astrophotography.mount_park
    target:
      device_id: !input nina_rig
    continue_on_error: true

  - alias: "Stop tracking"
    action: nina_astrophotography.mount_set_tracking
    target:
      device_id: !input nina_rig
    data:
      enabled: false
    continue_on_error: true

  - alias: "Warm the camera"
    action: nina_astrophotography.camera_warm
    target:
      device_id: !input nina_rig
    data:
      minutes: !input warming_ramp_minutes
    continue_on_error: true

  - alias: "Wait for the mount to reach its park position"
    wait_template: "{{ is_state(mount_parked, 'on') }}"
    timeout: "00:03:00"
    continue_on_timeout: true

  - alias: "Close the dome"
    action: nina_astrophotography.dome_close
    target:
      device_id: !input nina_rig
    continue_on_error: true
    enabled: !input close_dome

  - alias: "Wait out the camera warming ramp"
    delay:
      minutes: !input warming_ramp_minutes

  - alias: "Notify that the session is over"
    if:
      - condition: template
        value_template: "{{ notify_device != '' }}"
    then:
      - action: "notify.{{ notify_device }}"
        data:
          title: "🌅 N.I.N.A. session complete"
          message: >
            Session ended. Mount parked: {{ is_state(mount_parked, 'on') }}.
            Camera warming finished.

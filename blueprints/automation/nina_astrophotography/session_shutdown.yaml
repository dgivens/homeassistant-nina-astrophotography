blueprint:
  name: "N.I.N.A. – Session Shutdown"
  description: >
    A planned end-of-night shutdown: stop the sequence, park the mount, close
    the dome once the mount confirms park, and warm the camera.

    This is the scheduled counterpart to the unsafe-conditions abort, not a
    replacement for it. Every step continues on error, so a mount that refuses
    to park still leaves the camera warming — but the dome is the exception:
    it closes only over a mount that has confirmed park.
  domain: automation
  author: dgivens
  source_url: https://github.com/dgivens/homeassistant-nina-astrophotography/blob/main/blueprints/automation/nina_astrophotography/session_shutdown.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        nina_rig:
          name: N.I.N.A. instance
          selector:
            device:
              integration: nina_astrophotography
        sequence_running:
          name: Sequence running
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: running
        mount_parked:
          name: Mount at park
          description: >
            The dome closes only once this reads on. A roof closing over an
            unparked telescope is how the mirror gets broken.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor

    schedule:
      name: Schedule
      icon: mdi:clock-outline
      input:
        trigger_time:
          name: Shutdown time
          description: Typically half an hour before dawn.
          default: "05:00:00"
          selector:
            time:
        only_if_sequence_stopped:
          name: Wait for the sequence to finish
          description: >
            Wait up to two hours for the running sequence to end before
            shutting down. It is stopped anyway once that elapses.
          default: true
          selector:
            boolean:

    settings:
      name: Settings
      icon: mdi:cog
      input:
        close_dome:
          name: Close the dome
          description: Only over a mount that has confirmed park.
          default: false
          selector:
            boolean:
        warming_ramp_minutes:
          name: Camera warming time
          default: 20
          selector:
            number:
              min: 5
              max: 60
              unit_of_measurement: min
        notify_target:
          name: Notify
          description: Notify entities to alert. Leave empty for none.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true

mode: single
max_exceeded: silent

# Inputs must be bound here before templates can reference them.
variables:
  mount_parked: !input mount_parked
  nina_rig: !input nina_rig
  sequence_running: !input sequence_running

triggers:
  - trigger: time
    at: !input trigger_time

conditions:
  # Selectors cannot cross-filter, so the entities and the device above can
  # name different rigs on a two-rig install — which would park the wrong
  # telescope. Only blocks when they positively disagree.
  - alias: "The entities and the device name the same rig"
    condition: template
    value_template: >
      {% set entry = config_entry_id(sequence_running) %}
      {% set rig = device_attr(nina_rig, 'config_entries') %}
      {{ entry is none or rig is not iterable or entry in rig | list }}

actions:
  # `wait_template`, not `wait_for_trigger`: a sequence that has already
  # finished publishes no state change, and this would wait the full timeout.
  - alias: "Wait for the sequence to finish"
    wait_template: "{{ is_state(sequence_running, 'off') }}"
    timeout: "02:00:00"
    continue_on_timeout: true
    enabled: !input only_if_sequence_stopped

  - alias: "Stop the sequence if it is still running"
    if:
      - condition: state
        entity_id: !input sequence_running
        state: "on"
    then:
      - action: nina_astrophotography.sequence_stop
        target:
          device_id: !input nina_rig
        continue_on_error: true
      - delay: "00:00:10"

  # Park stops tracking itself. Sending `mount_set_tracking` here would land
  # mid-slew, where the driver may refuse it — and once parked most drivers
  # refuse it outright.
  - alias: "Park the mount"
    action: nina_astrophotography.mount_park
    target:
      device_id: !input nina_rig
    continue_on_error: true

  - alias: "Wait for the mount to reach its park position"
    wait_template: "{{ is_state(mount_parked, 'on') }}"
    timeout: "00:03:00"
    continue_on_timeout: true

  # The roof before the camera, and only over a parked mount: the wait above
  # times out rather than failing, and a disconnected mount never reads `on`.
  - alias: "Close the dome, but only over a parked mount"
    enabled: !input close_dome
    if:
      - condition: template
        value_template: "{{ is_state(mount_parked, 'on') }}"
    then:
      - action: nina_astrophotography.dome_close
        target:
          device_id: !input nina_rig
        continue_on_error: true
    else:
      - action: notify.send_message
        target:
          entity_id: !input notify_target
        data:
          title: "🚨 Roof left open"
          message: >
            The mount did not confirm park, so the dome was NOT closed.
            Manual intervention needed.
        continue_on_error: true

  - alias: "Warm the camera"
    action: nina_astrophotography.camera_warm
    target:
      device_id: !input nina_rig
    data:
      minutes: !input warming_ramp_minutes
    continue_on_error: true

  - alias: "Wait out the camera warming ramp"
    delay:
      minutes: !input warming_ramp_minutes

  - alias: "Notify that the session is over"
    action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: "🌅 N.I.N.A. session complete"
      message: >
        Session ended. Mount parked: {{ is_state(mount_parked, 'on') }}.
        Camera warming finished.
    continue_on_error: true

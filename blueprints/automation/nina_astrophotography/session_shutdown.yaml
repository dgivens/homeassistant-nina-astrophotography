blueprint:
  name: "N.I.N.A. – Session Shutdown"
  description: >
    Performs a safe observatory shutdown: stops any running sequence, parks the mount,
    warms the camera, and optionally closes the dome. Can be triggered at dawn, by
    a time, or by a manual call.
  domain: automation
  source_url: https://github.com/christian-photo/ninaAPI
  input:
    nina_device:
      name: N.I.N.A. Instance
      description: Any device belonging to the instance to shut down.
      selector:
        device:
          filter:
            - integration: nina_astrophotography

    sequence_entity:
      name: Sequence Running Sensor
      description: Usually binary_sensor.<instance>_sequence_running.
      selector:
        entity:
          filter:
            - integration: nina_astrophotography
              domain: binary_sensor

    image_count_entity:
      name: Session Image Count Sensor
      description: Usually sensor.<instance>_session_image_count. Used in the notification.
      selector:
        entity:
          filter:
            - integration: nina_astrophotography
              domain: sensor

    trigger_time:
      name: Shutdown Time
      description: Time to trigger shutdown (e.g. 30 min before dawn).
      default: "05:00:00"
      selector:
        time:

    only_if_sequence_stopped:
      name: Only Shut Down if Sequence Finished
      description: >
        If enabled, the shutdown will only proceed when the sequence is not running.
        If the sequence is still running, the automation will wait up to 2 hours.
      default: true
      selector:
        boolean:

    warming_ramp_minutes:
      name: Camera Warming Ramp Time (minutes)
      description: How many minutes to take to warm the camera sensor back to ambient.
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: min

    close_dome:
      name: Close Dome
      description: Close the dome shutter after parking.
      default: false
      selector:
        boolean:

    notify_service:
      name: Notification Service (optional)
      description: >
        Notification service to call on completion, without the leading "notify.".
        Leave blank to skip the notification.
      default: ""
      selector:
        text:

variables:
  sequence_entity: !input sequence_entity
  image_count_entity: !input image_count_entity
  only_if_sequence_stopped: !input only_if_sequence_stopped
  close_dome: !input close_dome
  notify_service: !input notify_service

trigger:
  - platform: time
    at: !input trigger_time

condition: []

action:
  - alias: "Optionally wait for sequence to finish"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ only_if_sequence_stopped }}"
        sequence:
          - wait_template: "{{ is_state(sequence_entity, 'off') }}"
            timeout: "02:00:00"
            continue_on_timeout: true

  - alias: "Stop sequence if still running"
    choose:
      - conditions:
          - condition: state
            entity_id: !input sequence_entity
            state: "on"
        sequence:
          - service: nina_astrophotography.sequence_stop
            target:
              device_id: !input nina_device
          - delay: "00:00:10"

  - alias: "Park the mount"
    service: nina_astrophotography.mount_park
    target:
      device_id: !input nina_device

  - alias: "Stop tracking"
    service: nina_astrophotography.mount_set_tracking
    target:
      device_id: !input nina_device
    data:
      mode: Stopped

  - alias: "Warm the camera"
    service: nina_astrophotography.camera_warm
    target:
      device_id: !input nina_device
    data:
      minutes: !input warming_ramp_minutes

  - alias: "Wait for camera to warm"
    delay:
      minutes: !input warming_ramp_minutes

  - alias: "Conditionally close dome"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ close_dome }}"
        sequence:
          - service: nina_astrophotography.dome_close
            target:
              device_id: !input nina_device

  - alias: "Notify on completion"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_service != '' }}"
        sequence:
          - service: "notify.{{ notify_service }}"
            data:
              title: "🌅 N.I.N.A. Session Complete"
              message: >
                Session ended. Mount parked. Camera warming complete.
                Total frames: {{ states(image_count_entity) }}.

mode: single
max_exceeded: silent

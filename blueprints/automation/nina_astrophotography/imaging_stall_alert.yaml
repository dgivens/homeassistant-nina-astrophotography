blueprint:
  name: "N.I.N.A. – Imaging Stall Alert"
  description: >
    Notifies when the rig has stopped producing frames for a bad reason, and
    clears itself when frames resume. Notify only — it never stops a sequence,
    parks a mount or moves a roof, because a false positive must cost a phone
    buzz and never a night.

    Three arms, because a stall has three shapes. N.I.N.A. itself unreachable
    leaves nothing current to read, so no template over the rig's own state can
    see that one; the rig's Reachable sensor, or failing it every entity going
    unavailable, does. A mount that parked itself under a running sequencer is
    a stall with no ambiguity and no timer. And the ordinary case: the frames
    simply stopped.

    Waiting is most of what a sequence does — for darkness, for a target's
    start window, for moon separation, for a safety loop — so the quiet arm is
    gated hard. It is silent while the sequence is waiting, for a settling
    period after a wait ends, while conditions are unsafe (the abort blueprint
    owns that case), and, unless you turn that off, in daylight. A Wait for
    Time Span shorter than the quiet period does neither: it paces a retry
    loop, which is how a stall often looks. Its clock
    starts when the last of those opens, not when the sequence started: a rig
    that has only just been let work has not stalled.

    It cannot see a rig that is imaging but producing garbage. Star count, HFR
    and RMS entities exist for that; it is a different alarm with different
    thresholds.
  domain: automation
  author: dgivens
  source_url: https://github.com/dgivens/homeassistant-nina-astrophotography/blob/main/blueprints/automation/nina_astrophotography/imaging_stall_alert.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        nina_rig:
          name: N.I.N.A. instance
          description: The rig to watch. Any of its devices identifies it.
          selector:
            device:
              integration: nina_astrophotography
        sequencer_running:
          name: Sequencer running
          description: >-
            Pick `sequencer_running`, not `imaging`: a stopped sequencer is not
            a stall, and this is also the entity whose disappearance says
            N.I.N.A. is unreachable.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: running
        rig_reachable:
          name: Rig reachable
          description: >-
            Optional, and recommended. The rig's "Reachable" sensor, which
            turns off on the first poll N.I.N.A. misses. Without it, a lost
            rig is noticed only once the sequencer sensor goes unavailable,
            which waits out the integration's outage grace period first.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: connectivity
              multiple: true
        imaging:
          name: Imaging
          description: >-
            The activity heuristic — frames arriving, whatever the sequencer
            says. Long enough off while the sequencer runs is the fast half of
            the stall test.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: running
        scheduler_waiting:
          name: Sequence waiting
          description: >-
            On while the sequence is deliberately waiting: Target Scheduler's
            wait for a target window, or a wait instruction of the sequence's
            own, such as Wait for Time until dusk. Hours of nothing that must
            never alert. Its attributes say how long each wait is, which is
            how a short span in a retry loop is told from a real wait.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        safety_unsafe:
          name: Unsafe conditions
          description: >-
            The rig's "Unsafe" sensor — on when conditions are unsafe. A rig
            holding station under cloud is behaving correctly, and the
            unsafe-conditions abort blueprint is the one that speaks.

            WIRE THIS IF YOUR RIG HAS A SAFETY MONITOR. Leaving it empty is
            correct only on a rig that has none — the entity does not exist
            there, so a required field would make this blueprint impossible to
            save. A rig that HAS a monitor and skips this will be alerted
            through every weather hold, which is exactly the case the
            unsafe-conditions abort blueprint already owns.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: safety
              multiple: true
        mount_at_park:
          name: Mount at park
          description: >-
            A mount that parked itself while the sequencer is running has
            already ended the night.

            Required, where the guider and meridian sensors below are optional,
            and the difference is deliberate: a rig without a guider is
            ordinary, a rig without a mount is not an imaging rig. This one
            also drives an alert arm rather than a line of the message, so
            leaving it empty would delete one of the three ways a stall is
            noticed instead of shortening a sentence.
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        last_frame_at:
          name: Last frame at
          description: >-
            The save time of the newest frame of any type. It is the frame's
            SAVE time, so the clock below already starts one exposure behind.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              device_class: timestamp
        site_latitude:
          name: Site latitude
          description: >-
            Optional; recommended for a hosted rig. Pick the rig's "Site
            latitude" sensor, and its "Site longitude" below. With both, night
            only and sun quiet hours use the sun where the rig is rather than
            where Home Assistant is. Until N.I.N.A. reports a site, Home
            Assistant's location stands in.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              multiple: true
        site_longitude:
          name: Site longitude
          description: The rig's "Site longitude" sensor.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              multiple: true

    diagnostics:
      name: What the alert reports
      icon: mdi:stethoscope
      description: >-
        Triage from bed, without opening Home Assistant. Every entity here is
        read for the message only; none of them can raise or clear an alert.
        Only entities every rig has are required here — anything that belongs to
        a device you might not own is under Extra detail below.
      input:
        camera_state:
          name: Camera state
          description: >-
            The single most diagnostic field: Idle, Exposing and Downloading
            are three different nights.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        last_image_target:
          name: Last image target
          description: >-
            What the newest frame was actually taken of. The message reports
            this rather than the sequence's current target, so the target and
            the filter below come from the same frame.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        sequence_target:
          name: Sequence target
          description: >-
            Where the sequence believes it is now. Reported only when it differs
            from the last frame's target — that difference is itself the
            diagnosis "it moved to a new target and then stalled".
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        camera_temperature:
          name: Camera temperature
          description: >-
            With the cooler power below: a warmed sensor means a shutdown has
            already run, so nobody needs to drive to the roof.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              device_class: temperature
        camera_cooler_power:
          name: Camera cooler power
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor

    extra_diagnostics:
      name: Extra detail
      icon: mdi:clipboard-text-search
      collapsed: true
      description: >-
        Optional. Each adds one field to the message; leave any of them empty on
        a rig that has no such device. Everything whose entity belongs to a
        device the rig may not have lives here: on a rig with no guider or no
        rotator those entities are never created, and a required input pointing
        at one would make this blueprint impossible to save.
      input:
        last_image_filter:
          name: Last image filter
          description: >-
            The filter the newest frame was taken through, reported next to the
            target. A stall part-way through a filter change names itself here.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              multiple: true
        guider_status:
          name: Guider status
          description: >-
            Whether the guider is guiding, calibrating or has lost its star.
            Belongs to the guider device, so an unguided rig has no such entity.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              multiple: true
        guider_rms:
          name: Total guiding RMS
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              multiple: true
        flip_sensor:
          name: Time to meridian flip
          description: >-
            Reading `unknown` is itself a diagnosis: the 24-hour sentinel it
            replaces means tracking is off.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
              device_class: duration
              multiple: true
        mount_at_home:
          name: Mount at home
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              multiple: true
        autofocus_failed:
          name: Autofocus failed
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: problem
              multiple: true
        safety_connected:
          name: Safety monitor connected
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
              device_class: connectivity
              multiple: true
        error_event:
          name: N.I.N.A. error
          description: >-
            The error event entity. Its newest event and the time it fired are
            reported; a plate-solve retry loop names itself here.
          default: []
          selector:
            entity:
              integration: nina_astrophotography
              domain: event
              multiple: true

    thresholds:
      name: Thresholds
      icon: mdi:timer-sand
      collapsed: true
      input:
        imaging_quiet_minutes:
          name: Imaging quiet for
          description: >-
            The fast half of the test: an Idle camera, a plate-solve retry
            loop, a hung autofocus. Measured autofocus runs are 4.0–4.6
            minutes, so the default clears them comfortably.
          default: 20
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: min
        longest_exposure_seconds:
          name: Longest exposure
          description: >-
            The longest sub your sequence takes. The grace below is ADDED to
            it, never multiplied: dither, download, filter change, autofocus
            and flip are fixed costs that do not scale with exposure.
          default: 600
          selector:
            number:
              min: 1
              max: 3600
              unit_of_measurement: s
        grace_minutes:
          name: Grace on top of one exposure
          description: >-
            The observed worst healthy gap between frames is 31.5 minutes, so
            the 30-minute default leaves real headroom where 5 would not. This
            window also covers "the rig never took a first frame tonight",
            measured from when the sequencer started or, if later, when the
            last gate opened.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: min
        settle_minutes:
          name: Settle after a wait ends
          description: >-
            Slew, rotation, filter change and settle after a wait
            ends took 11.6 minutes on the rig this was measured against. It
            runs from the end of the latest wait that is not a short span, so
            a long wait is not hidden behind the five-second settle a sequence
            takes after it. A Home Assistant restart forgets which waits
            ended, and the quiet clock restarts with it: the quiet arm then
            waits "Imaging quiet for" before alerting, which covers the settle
            as long as it is the longer of the two.
          default: 15
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min
        night_only:
          name: Only alert at night
          description: >-
            On by default: a sequence's twelve-hour daytime wait for darkness
            is not a stall. Turn it off if you image the sun. Reads the sun at
            the rig when its site is wired above, and `sun.sun` otherwise; if
            neither can be read, the gate stays open rather than muting every
            alert.
          default: true
          selector:
            boolean:

    quiet_hours:
      name: Quiet hours
      icon: mdi:weather-sunny-off
      collapsed: true
      description: >-
        A daily window in which no new alert is raised, for a rig you shut down
        by day. It mutes the unreachable alert too: a rig switched off on
        purpose is unreachable. A rig still unreachable when the window closes
        is reported then. An alert raised before the window opens runs on to
        its end.
      input:
        mute_mode:
          name: Mute
          default: "off"
          selector:
            select:
              mode: dropdown
              options:
                - label: Never
                  value: "off"
                - label: Between two times
                  value: fixed
                - label: While the sun is up
                  value: sun
        mute_from:
          name: Mute from
          description: >-
            Between two times only. Home Assistant's local time, which is not
            the rig's if it is hosted in another time zone.
          default: "08:00:00"
          selector:
            time:
        mute_until:
          name: Mute until
          description: >-
            Between two times only. May be earlier than the start, for a window
            that crosses midnight.
          default: "17:00:00"
          selector:
            time:
        mute_morning_altitude:
          name: Mute once the rising sun is above
          description: >-
            While the sun is up only. Twilight ends at -6° (civil), -12°
            (nautical) and -18° (astronomical). The sun is placed at the rig
            when its site is wired under Rig, and at Home Assistant otherwise.
          default: -12
          selector:
            number:
              min: -18
              max: 15
              step: 0.5
              unit_of_measurement: "°"
        mute_evening_altitude:
          name: Unmute once the setting sun is below
          description: >-
            While the sun is up only. Set it to where the sun is when you start
            the rig: +3° is roughly 20–30 minutes before sunset at mid
            latitudes.
          default: 3
          selector:
            number:
              min: -18
              max: 15
              step: 0.5
              unit_of_measurement: "°"

    notifications:
      name: Notifications
      icon: mdi:bell
      collapsed: true
      input:
        notify_target:
          name: Notify
          description: >-
            Notify entities to alert. Leave empty for none — the persistent
            notification is raised either way, but nobody is woken by it.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true
        escalate_minutes:
          name: Remind again after
          default: 60
          selector:
            number:
              min: 5
              max: 240
              unit_of_measurement: min
        escalations:
          name: Number of reminders
          description: >-
            After these, the alert stays open and silent until frames resume or
            the sequencer stops. A stall still stalled at 05:00 is a dawn
            problem, not a 3am one.
          default: 2
          selector:
            number:
              min: 0
              max: 10

# `single`, not `restart`: the quiet arm ticks every minute, and under `restart`
# each tick would destroy the pending wait below and re-notify — a phone buzz a
# minute, and no cleared message ever. The run owns the whole alert lifecycle
# instead, and `max_exceeded: silent` drops the ticks that arrive while it does.
# A new frame still pre-empts it, through the wait rather than through the mode.
mode: single
max_exceeded: silent

# Inputs must be bound here before templates can reference them.
variables:
  nina_rig: !input nina_rig
  sequencer_running: !input sequencer_running
  rig_reachable: !input rig_reachable
  scheduler_waiting: !input scheduler_waiting
  mount_at_park: !input mount_at_park
  safety_unsafe: !input safety_unsafe
  imaging: !input imaging
  last_frame_at: !input last_frame_at
  site_latitude: !input site_latitude
  site_longitude: !input site_longitude
  camera_state: !input camera_state
  last_image_target: !input last_image_target
  sequence_target: !input sequence_target
  camera_temperature: !input camera_temperature
  camera_cooler_power: !input camera_cooler_power
  last_image_filter: !input last_image_filter
  guider_status: !input guider_status
  guider_rms: !input guider_rms
  flip_sensor: !input flip_sensor
  mount_at_home: !input mount_at_home
  autofocus_failed: !input autofocus_failed
  safety_connected: !input safety_connected
  error_event: !input error_event
  settle_minutes: !input settle_minutes
  night_only: !input night_only
  mute_mode: !input mute_mode
  mute_from: !input mute_from
  mute_until: !input mute_until
  mute_morning_altitude: !input mute_morning_altitude
  mute_evening_altitude: !input mute_evening_altitude
  imaging_quiet_minutes: !input imaging_quiet_minutes
  longest_exposure_seconds: !input longest_exposure_seconds
  grace_minutes: !input grace_minutes
  escalations: !input escalations
  notify_target: !input notify_target
  # Added, never multiplied — see the input description.
  stale_after_seconds: >
    {{ longest_exposure_seconds | float(600) + grace_minutes | float(30) * 60 }}
  sequencer_on_seconds: >
    {% set running = states[sequencer_running] %}
    {{ 0 if running is none
       else (now() - running.last_changed).total_seconds() | round(0) }}
  # The sun's geometric altitude and declination, and its hour angle, negative
  # in the morning, from the low-precision solar position (within 0.01° of
  # astral). Placed at the rig when its site sensors read numbers, else at Home
  # Assistant; `none` when neither has coordinates, which leaves every sun gate
  # open. Every trigger renders this, so nothing in it may raise: a render
  # error would block every alert. The range check keeps `inf` out of `sin`.
  sun_position: >
    {% set rig_lat = expand(site_latitude) | map(attribute='state')
       | first | default(none) | float(none) %}
    {% set rig_lon = expand(site_longitude) | map(attribute='state')
       | first | default(none) | float(none) %}
    {% set at_rig = rig_lat is number and rig_lon is number %}
    {% set lat = rig_lat if at_rig
       else state_attr('zone.home', 'latitude') | float(none) %}
    {% set lon = rig_lon if at_rig
       else state_attr('zone.home', 'longitude') | float(none) %}
    {% if lat is number and lon is number
          and -90 <= lat <= 90 and -360 <= lon <= 360 %}
      {% set rad = pi / 180 %}
      {% set n = now().timestamp() / 86400 + 2440587.5 - 2451545.0 %}
      {% set g = ((357.528 + 0.9856003 * n) % 360) * rad %}
      {% set l = (280.460 + 0.9856474 * n) % 360 %}
      {% set sun_lon = (l + 1.915 * sin(g) + 0.020 * sin(2 * g)) * rad %}
      {% set eps = (23.439 - 0.0000004 * n) * rad %}
      {% set dec = asin(sin(eps) * sin(sun_lon)) %}
      {% set ra = atan2(cos(eps) * sin(sun_lon), cos(sun_lon)) / rad %}
      {% set gmst = ((18.697374558 + 24.06570982441908 * n) % 24) * 15 %}
      {% set hour_angle = (gmst + lon - ra + 180) % 360 - 180 %}
      {% set sin_alt = sin(lat * rad) * sin(dec)
         + cos(lat * rad) * cos(dec) * cos(hour_angle * rad) %}
      {{ {'altitude': asin([[sin_alt, 1] | min, -1] | max) / rad,
          'declination': dec / rad, 'hour_angle': hour_angle,
          'latitude': lat, 'at_rig': at_rig} }}
    {% else %}
      {{ none }}
    {% endif %}
  # Where the quiet clock starts: the latest of the sequencer starting and each
  # gate opening — conditions turning safe, the sun setting, the quiet hours
  # ending. A gate mutes only while it is shut, so a clock running from before
  # it opened alerts on the first tick after, however briefly the rig has been
  # free to work. NOTHING may be measured from before the sequencer started:
  # `last_frame_at` holds the newest frame N.I.N.A. knows of, which survives
  # across nights while it stays up, so at 20:00 it still reads last night's
  # 05:00 frame. Ties keep the sequencer, which the list puts first.
  #
  # The sun's hour angle turns 1° every 240 s, so the time since it set below
  # an altitude is the hour angle past the one where it crosses it; empty
  # where it never gets that high.
  clock: >
    {% macro since_below(sun, altitude) %}
      {%- set rad = pi / 180 %}
      {%- set lat = sun.latitude * rad %}
      {%- set dec = sun.declination * rad %}
      {%- set cos_crossing = (sin(altitude * rad) - sin(lat) * sin(dec))
         / (cos(lat) * cos(dec)) %}
      {%- if cos_crossing < 1 %}
        {{- (sun.hour_angle - acos([cos_crossing, -1] | max) / rad) % 360 * 240 }}
      {%- endif %}
    {%- endmacro %}
    {% set starts = [{'seconds': sequencer_on_seconds | float(0),
                      'from': 'the sequence started'}] %}
    {% set monitor = expand(safety_unsafe) | first | default(none) %}
    {% if monitor is not none and monitor.state == 'off' %}
      {% set starts = starts + [{'from': 'conditions turned safe',
         'seconds': (now() - monitor.last_changed).total_seconds()}] %}
    {% endif %}
    {% set sun = states['sun.sun'] %}
    {% if night_only and sun_position and sun_position.at_rig %}
      {% set since = since_below(sun_position, -0.833) %}
      {% if since %}
        {% set starts = starts + [{'from': 'the sun set',
           'seconds': since | float(0)}] %}
      {% endif %}
    {% elif night_only and sun is not none and sun.state == 'below_horizon' %}
      {% set starts = starts + [{'from': 'the sun set',
         'seconds': (now() - sun.last_changed).total_seconds()}] %}
    {% endif %}
    {% if mute_mode == 'fixed' and mute_from != mute_until %}
      {% set end = today_at(mute_until) %}
      {% set end = end - timedelta(days=1) if end > now() else end %}
      {% set starts = starts + [{'from': 'the quiet hours ended',
         'seconds': (now() - end).total_seconds()}] %}
    {% elif mute_mode == 'sun' and sun_position %}
      {% set since = since_below(sun_position, mute_evening_altitude) %}
      {% if since %}
        {% set starts = starts + [{'from': 'the quiet hours ended',
           'seconds': since | float(0)}] %}
      {% endif %}
    {% endif %}
    {{ starts | sort(attribute='seconds') | first }}
  # How long the rig has been quiet: time since the last frame, floored at the
  # clock. With no frame at all it IS the clock — "the rig never took a first
  # frame tonight" is a stall, and testing only for a value would make this
  # blueprint mute for exactly that case.
  quiet_seconds: >
    {% set frame = states[last_frame_at] %}
    {% if frame is not none and frame.state not in ['unknown', 'unavailable'] %}
      {{ [now().timestamp() - as_timestamp(frame.state, now().timestamp()),
          clock.seconds] | min | round(0) }}
    {% else %}
      {{ clock.seconds | round(0) }}
    {% endif %}
  # Whether the floor is what `quiet_seconds` ended up measuring. The first
  # alert of a night usually reports the clock, not the age of a frame —
  # `last_frame_at` may still hold last night's — and a message that called
  # that figure a frame age would have a reader at 3am believing the rig went
  # quiet minutes ago rather than hours.
  floored: >
    {% set frame = states[last_frame_at] %}
    {{ frame is none or frame.state in ['unknown', 'unavailable']
       or now().timestamp() - as_timestamp(frame.state, now().timestamp())
          > clock.seconds }}
  # The arm a run answers for. The minute tick also re-checks reachability,
  # because the unreachable triggers fire once: one that lands inside the quiet
  # hours is dropped, and without this a rig that never came back at dusk
  # would not be reported all night. It watches the same row, held as long,
  # as those triggers do.
  arm: >
    {% if trigger.id != 'quiet' %}
      {{ trigger.id }}
    {% else %}
      {% set row = expand(rig_reachable) | first | default(none)
         if rig_reachable else states[sequencer_running] %}
      {% set down = ['off', 'unavailable'] if rig_reachable else ['unavailable'] %}
      {{ 'unreachable' if row is not none and row.state in down
         and (now() - row.last_changed).total_seconds() >= 120 else 'quiet' }}
    {% endif %}

triggers:
  # N.I.N.A. down, the imaging PC rebooted, the tunnel gone. Nothing the rig
  # reports is current, so no other arm can fire and no template over its state
  # can see this at all. Held two minutes so a reload or a few missed polls are
  # not an alert. `reachable` is `off` from the first missed poll, and
  # `unavailable` only when the entry failed to load; without it, the
  # sequencer's row going `unavailable` stands in, once the outage grace has
  # run out.
  - trigger: state
    entity_id: !input rig_reachable
    to: ["off", "unavailable"]
    for: "00:02:00"
    id: unreachable
  - trigger: state
    entity_id: !input sequencer_running
    to: "unavailable"
    for: "00:02:00"
    id: unreachable

  - trigger: state
    entity_id: !input mount_at_park
    to: "on"
    id: parked

  # The clock gates below have to be re-evaluated, so the quiet arm needs a
  # repeating trigger: a template trigger fires once on its false-to-true edge
  # and would lose the stall for the rest of the night.
  - trigger: time_pattern
    minutes: "/1"
    id: quiet

conditions:
  # Selectors cannot cross-filter, so on a two-rig install the entities above
  # and the device can name different rigs — which would report the wrong
  # telescope's state. Only blocks when they positively disagree: a template
  # that cannot resolve must never suppress an alert.
  - alias: "The entities and the device name the same rig"
    condition: template
    value_template: >
      {% set entry = config_entry_id(sequencer_running) %}
      {% set rig = device_attr(nina_rig, 'config_entries') %}
      {{ entry is none or rig is not iterable or entry in rig | list }}

  - alias: "A rig with a Reachable sensor is reported through it alone"
    condition: template
    value_template: >
      {{ trigger.id != 'unreachable'
         or not rig_reachable
         or trigger.entity_id in rig_reachable }}

  # Applies to every arm, the unreachable one included.
  - alias: "Outside the quiet hours"
    condition: template
    value_template: >
      {% if mute_mode == 'fixed' %}
        {% set start = today_at(mute_from) %}
        {% set end = today_at(mute_until) %}
        {% if start == end %} true
        {% elif start < end %} {{ not (start <= now() < end) }}
        {% else %} {{ end <= now() < start }}
        {% endif %}
      {% elif mute_mode == 'sun' and sun_position %}
        {{ sun_position.altitude <= (mute_morning_altitude
           if sun_position.hour_angle < 0 else mute_evening_altitude) }}
      {% else %}
        true
      {% endif %}

  # These gates live HERE, not in the actions. A bare condition that fails
  # inside a `choose` branch raises `_ConditionFail`, which Home Assistant
  # catches at that branch's own script boundary and — unlike `stop:` — does
  # NOT re-raise into the parent. The
  # parent sequence then carries on to the next action, so gates written inside
  # a branch are not gates at all: they abort the branch and alert anyway. At
  # the automation's top level a false condition genuinely stops the run.
  #
  # Each arm carries its own gates, because they differ. The unreachable arm
  # has none: when it fires, the rig's entities are unavailable or hold readings
  # N.I.N.A. has not confirmed, so any gate over them would mute the failure
  # this blueprint most needs to catch.
  - alias: "The gates for the arm that fired"
    condition: or
    conditions:
      - condition: template
        value_template: "{{ arm == 'unreachable' }}"

      - alias: "A park is only a stall if the sequencer was still running"
        condition: and
        conditions:
          - condition: trigger
            id: parked
          - condition: state
            entity_id: !input sequencer_running
            state: "on"

      - alias: "Quiet, with all five gates and a threshold passed"
        condition: and
        conditions:
          - condition: template
            value_template: "{{ arm == 'quiet' }}"

          - alias: "The sequencer is running — a stopped one is not a stall"
            condition: state
            entity_id: !input sequencer_running
            state: "on"

          # A short span paces a retry loop, so it explains none of the
          # silence. Unavailable mutes: the unreachable arm owns that.
          - alias: "The sequence is not in a wait that explains the silence"
            condition: template
            value_template: >
              {% set waiting = states[scheduler_waiting] %}
              {% set span = state_attr(scheduler_waiting, 'span_seconds') %}
              {{ waiting is not none
                 and (waiting.state == 'off'
                      or waiting.state == 'on' and span is number
                         and span < imaging_quiet_minutes | float(20) * 60) }}

          # "Not `on`", never "is `off`", and a template rather than a
          # `condition: state` wrapped in `not`: an empty input makes that
          # condition vacuously true, and the `not` would then invert it into a
          # gate that mutes the blueprint on every rig with no safety monitor.
          #
          # Wired and `on` suppresses. Wired and `unknown` — which is what the
          # entity reads when the monitor drops out — does NOT: testing for
          # `off` would mute the stall alarm at exactly the moment the rig lost
          # the device that would otherwise explain the silence.
          - alias: "Conditions are not unsafe — the abort blueprint owns that"
            condition: template
            value_template: >
              {% set monitor = expand(safety_unsafe) | first | default(none) %}
              {{ monitor is none or monitor.state != 'on' }}

          # From the waits' own end times, never `last_changed`: a short span
          # flips the sensor on every pass of a retry loop, and each flip would
          # restart the settle. An integration without `recent_waits` falls
          # back to `last_changed`.
          - alias: "A wait ended long enough ago to have settled"
            condition: template
            value_template: >
              {% set waiting = states[scheduler_waiting] %}
              {% set ended = state_attr(scheduler_waiting, 'recent_waits') %}
              {% set settle = settle_minutes | float(15) * 60 %}
              {% if waiting is none %}
                false
              {% elif ended is none %}
                {{ (now() - waiting.last_changed).total_seconds() > settle }}
              {% else %}
                {% set short = imaging_quiet_minutes | float(20) * 60 %}
                {% set latest = namespace(at=none) %}
                {% for wait in ended
                   if not (wait.span_seconds is number
                           and wait.span_seconds < short) %}
                  {% set at = as_datetime(wait.ended_at) %}
                  {% if latest.at is none or at > latest.at %}
                    {% set latest.at = at %}
                  {% endif %}
                {% endfor %}
                {{ latest.at is none
                   or (now() - latest.at).total_seconds() > settle }}
              {% endif %}

          # "Not above", never "is below": with the sun integration removed or
          # the entity renamed, "is below" is false forever and silently mutes
          # the quiet arm. A daytime alert is noisy but visible.
          #
          # A template rather than `enabled: !input` on a state condition:
          # `enabled` is honoured on a script action, and these are nested
          # conditions rather than actions.
          #
          # Without the rig's site this reads Home Assistant's `sun.sun`, the
          # same sunset every other automation on the install sees.
          # -0.833° is sunset: refraction plus the sun's semidiameter.
          - alias: "Night only, unless the user images the sun"
            condition: template
            value_template: >
              {% if not night_only %} true
              {% elif sun_position and sun_position.at_rig %}
                {{ sun_position.altitude <= -0.833 }}
              {% else %}
                {{ not is_state('sun.sun', 'above_horizon') }}
              {% endif %}

          - alias: "Frames really have stopped"
            condition: or
            conditions:
              # Not the native `for:` on a state condition, which measures from
              # `last_changed` alone: `imaging` is off all day, so at 20:01 it
              # has been off for hours and the gate would be satisfied the
              # instant the sequencer started — an alert raised before a first
              # frame is physically possible. Floored at the clock, it starts
              # when the rig is let work.
              - alias: "Nothing has been arriving for the quiet period"
                condition: template
                value_template: >
                  {% set active = states[imaging] %}
                  {{ active is not none and active.state == 'off'
                     and [(now() - active.last_changed).total_seconds(),
                          clock.seconds] | min
                         > imaging_quiet_minutes | float(20) * 60 }}
              - alias: "No frame within one exposure plus the grace"
                condition: template
                value_template: >
                  {{ quiet_seconds | float(0) > stale_after_seconds | float(0) }}

actions:
  - variables:
      rig_name: >
        {{ device_attr(nina_rig, 'name_by_user')
           or device_attr(nina_rig, 'name') or 'N.I.N.A.' }}
      alert_id: "nina_stall_{{ nina_rig }}"
      quiet_minutes: "{{ (quiet_seconds | float(0) / 60) | round(0) }}"
      # Every line at one indent: a folded YAML scalar keeps the newlines of a
      # MORE-indented line, so laying the branches out in a block would put
      # hard line breaks through the middle of a sentence.
      reason: >-
        {%- if arm == 'unreachable' %}
        Home Assistant cannot reach N.I.N.A. — it has not answered for at least
        two minutes.
        {%- elif arm == 'parked' %}
        The mount parked itself while the sequencer was still running.
        {%- elif floored %}
        No frames in the {{ quiet_minutes }} minutes since {{ clock.from }}.
        {%- else %}
        No frames for {{ quiet_minutes }} minutes.
        {%- endif %}
      # Read once, here, so the raise and the notification carry the same
      # snapshot. `expand` takes the optional inputs whether they hold one
      # entity or none, and silently drops one that does not exist. Folded to a
      # single ·-separated line on purpose: a folded YAML scalar joins its lines
      # with spaces, so laying the fields out in columns here would not survive.
      #
      # An unreachable rig gets no field list at all. Every entity is
      # `unavailable`, so the line would be a row of the same word — and the
      # mount field in particular would print "not parked" for a park state
      # nothing can currently read, which is worse than saying nothing.
      #
      # The error event holds its last value until another arrives, however
      # old, so one from before the sequence started is left out.
      detail: >-
        {%- if arm == 'unreachable' %}
        Nothing further can be read while the rig is unavailable — the last
        known values in Home Assistant are as stale as the connection.
        {%- else %}
        {%- set filt = expand(last_image_filter) | first | default(none) %}
        {%- set guider = expand(guider_status) | first | default(none) %}
        {%- set rms = expand(guider_rms) | first | default(none) %}
        {%- set flip = expand(flip_sensor) | first | default(none) %}
        {%- set homed = expand(mount_at_home) | first | default(none) %}
        {%- set af = expand(autofocus_failed) | first | default(none) %}
        {%- set safety = expand(safety_connected) | first | default(none) %}
        {%- set err = expand(error_event) | first | default(none) %}
        {%- set frame_target = states(last_image_target) %}
        {%- set now_target = states(sequence_target) %}
        {%- set park = states(mount_at_park) %}
        Last frame {{ frame_target }}{% if filt %},
        filter {{ filt.state }}{% endif %}{% if now_target not in
        [frame_target, 'unknown', 'unavailable'] %},
        now on {{ now_target }}{% endif %} ·
        camera {{ states(camera_state) }} at {{ states(camera_temperature) }} °C,
        cooler {{ states(camera_cooler_power) }} %
        {%- if guider %} · guider {{ guider.state }}{% if rms %} (RMS {{ rms.state }}){% endif %}{% endif %} ·
        mount {{ {'on': 'parked', 'off': 'not parked'}.get(park, 'park ' ~ park) }}
        {%- if homed %}, {{ 'at home' if homed.state == 'on' else 'not at home' }}{% endif %}
        {%- if flip %} · flip {{ flip.state }}{% endif %}
        {%- if af %} · autofocus failed {{ af.state }}{% endif %}
        {%- if safety %} · safety monitor connected {{ safety.state }}{% endif %}
        {%- set started = now().timestamp() - sequencer_on_seconds | float(0) %}
        {%- if err and as_timestamp(err.state, 0) >= started %} · last error
        {{ err.attributes.event_type | default('none') }} at {{ err.state }}{% endif %}
        {%- endif %}

  - alias: "Raise the alert"
    action: persistent_notification.create
    data:
      notification_id: "{{ alert_id }}"
      title: "🛑 {{ rig_name }} imaging stalled"
      message: "{{ reason }}\n\n{{ detail }}"
    continue_on_error: true

  # `notify.send_message` against a notify ENTITY, never `notify.<service>`
  # built from text: a service name that does not exist raises ServiceNotFound,
  # which `continue_on_error` does not suppress. Each call is also skipped when
  # no target is set, because then the notify integration may not be loaded,
  # and a ServiceNotFound here would end the run before anything could dismiss
  # the persistent notification.
  - alias: "Tell someone"
    if: "{{ notify_target | count > 0 }}"
    then:
      - action: notify.send_message
        target:
          entity_id: !input notify_target
        data:
          title: "🛑 {{ rig_name }} imaging stalled"
          message: "{{ reason }} {{ detail }}"
        continue_on_error: true

  # The run stays alive until the stall actually resolves. Ending it after the
  # last reminder would hand the next minute tick an open gate and a fresh
  # alert, which is the 3am loop the reminder cap exists to prevent — and it
  # would leave the persistent notification standing with nothing left to
  # dismiss it.
  - alias: "Wait for frames to resume, reminding while anyone can still act"
    repeat:
      sequence:
        - wait_for_trigger:
            # `not_to`, not a bare state trigger: `last_frame_at` going
            # unavailable is a state change too, and it means the opposite of
            # a frame landing.
            - trigger: state
              entity_id: !input last_frame_at
              not_to:
                - "unknown"
                - "unavailable"
              id: frame
            - trigger: state
              entity_id: !input sequencer_running
              to: "off"
              id: sequence_ended
          timeout:
            minutes: !input escalate_minutes
          continue_on_timeout: true

        - alias: "Remind, up to the configured number of times"
          if:
            - condition: template
              value_template: >
                {{ not wait.completed and repeat.index <= escalations | int(2)
                   and notify_target | count > 0 }}
          then:
            - action: notify.send_message
              target:
                entity_id: !input notify_target
              data:
                title: "🛑 {{ rig_name }} still stalled"
                message: >-
                  Reminder {{ repeat.index }} of {{ escalations | int(2) }}.
                  {%- set frame = states[last_frame_at] %}
                  {%- if frame is not none and frame.state not in ['unknown', 'unavailable'] %}
                  Last frame {{ ((now().timestamp()
                  - as_timestamp(frame.state, now().timestamp())) / 60) | round(0) }}
                  minutes ago.
                  {%- else %}
                  Still no frame tonight.
                  {%- endif %}
                  Camera: {{ states(camera_state) }}.
                  {%- set guider = expand(guider_status) | first | default(none) %}
                  {%- if guider %} Guider: {{ guider.state }}.{% endif %}
              continue_on_error: true
      until:
        - condition: template
          value_template: "{{ wait.completed }}"

  # Only ever reached by a run that raised an alert, so a cleared message can
  # never arrive on its own. SEQUENCE-FINISHED fires on a manual stop as well
  # as at the end of the night and the two are indistinguishable, so this says
  # what it observed rather than claiming the night completed.
  - alias: "Dismiss the alert"
    action: persistent_notification.dismiss
    data:
      notification_id: "{{ alert_id }}"
    continue_on_error: true

  - alias: "Say what ended it"
    if: "{{ notify_target | count > 0 }}"
    then:
      - action: notify.send_message
        target:
          entity_id: !input notify_target
        data:
          title: "✅ {{ rig_name }} imaging resumed"
          message: >-
            {%- if wait.trigger.id == 'frame' %}
            A frame has landed — the rig is producing again.
            {%- else %}
            The sequencer stopped. That is either the end of the night or a manual
            stop; nothing distinguishes them.
            {%- endif %}
        continue_on_error: true

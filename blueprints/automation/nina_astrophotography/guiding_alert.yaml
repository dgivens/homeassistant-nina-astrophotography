blueprint:
  name: "N.I.N.A. – Guiding Quality Alert"
  description: >
    Notifies when total guiding RMS stays above a threshold while the guider is
    actually guiding. Catches cloud, wind and seeing degradation mid-session.

    Guiding is a condition rather than a trigger source, and it keys on the
    guider's own status: RMS is reported through calibration, looping and a
    lost lock too, where a spike means nothing.
  domain: automation
  author: dgivens
  source_url: https://github.com/dgivens/homeassistant-nina-astrophotography/blob/main/blueprints/automation/nina_astrophotography/guiding_alert.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        nina_rig:
          name: N.I.N.A. instance
          description: The rig to run an autofocus on, if that is enabled below.
          selector:
            device:
              integration: nina_astrophotography
        rms_sensor:
          name: Total guiding RMS
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        guider_status:
          name: Guider status
          description: >
            The rig's guider status sensor. `Guiding` is the only state where
            an RMS figure means what it says.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor

    settings:
      name: Settings
      icon: mdi:cog
      input:
        rms_threshold:
          name: RMS threshold
          description: Alert when total RMS stays above this value.
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.1
              unit_of_measurement: arcsec
        sustained_minutes:
          name: Sustained duration
          description: How long RMS must stay above the threshold before alerting.
          default: 3
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: min
        run_autofocus:
          name: Run an autofocus on alert
          description: >
            Off by default, and think before enabling it: this is the imaging
            tab's autofocus, run OUTSIDE the sequencer. The camera is shared,
            so the sequence can take a sub at a defocused position while it
            runs. A sequence's own autofocus triggers are the better tool, and
            high RMS is more often cloud or wind than focus drift.
          default: false
          selector:
            boolean:
        cooldown_minutes:
          name: Cooldown between alerts
          default: 15
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: min
        notify_target:
          name: Notify
          selector:
            entity:
              domain: notify
              multiple: true

# `single` plus the closing delay suppresses a dip-and-return inside the
# cooldown window. A `numeric_state` trigger fires only on crossing the
# threshold, so it does not re-fire while RMS simply stays high.
mode: single
max_exceeded: silent

# Inputs must be bound here before templates can reference them.
variables:
  nina_rig: !input nina_rig
  rms_sensor: !input rms_sensor
  rms_threshold: !input rms_threshold
  sustained_minutes: !input sustained_minutes

triggers:
  - trigger: numeric_state
    entity_id: !input rms_sensor
    above: !input rms_threshold
    for:
      minutes: !input sustained_minutes

conditions:
  - alias: "The guider is actually guiding"
    condition: state
    entity_id: !input guider_status
    state: "Guiding"
  - alias: "The entities and the device name the same rig"
    condition: template
    value_template: >
      {% set entry = config_entry_id(rms_sensor) %}
      {% set rig = device_attr(nina_rig, 'config_entries') %}
      {{ entry is none or rig is not iterable or entry in rig | list }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: "⚠️ Guiding alert"
      message: >
        Guide RMS has been {{ states(rms_sensor) }}" for {{ sustained_minutes }}
        minutes (threshold {{ rms_threshold }}").
    continue_on_error: true

  - alias: "Run an autofocus"
    action: nina_astrophotography.focuser_auto_focus
    target:
      device_id: !input nina_rig
    continue_on_error: true
    enabled: !input run_autofocus

  - alias: "Hold off further alerts for the cooldown period"
    delay:
      minutes: !input cooldown_minutes

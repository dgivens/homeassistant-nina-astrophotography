camera_cool:
  name: Cool Camera
  description: Start cooling the camera sensor to a target temperature.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    temperature:
      name: Target Temperature (°C)
      description: Target sensor temperature in degrees Celsius, from -50 to 50.
      required: true
      example: -10
      selector:
        number:
          min: -50
          max: 50
          unit_of_measurement: "°C"
    minutes:
      name: Ramp Time
      description: >-
        Minimum minutes over which to ramp to the target temperature, 0 or
        more. Omit to use the ramp N.I.N.A.'s own profile specifies for this
        camera.
      example: 10
      selector:
        number:
          min: 0
          step: "any"
          unit_of_measurement: min
          mode: box

camera_warm:
  name: Warm Camera
  description: Gradually warm the camera sensor back to ambient temperature.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    minutes:
      name: Ramp Time
      description: >-
        Minimum minutes over which to ramp back to ambient, 0 or more. Omit to
        use the ramp N.I.N.A.'s own profile specifies for this camera.
      example: 10
      selector:
        number:
          min: 0
          step: "any"
          unit_of_measurement: min
          mode: box

camera_capture:
  name: Capture Image
  description: Take a single camera exposure.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    duration:
      name: Exposure
      description: >-
        Exposure duration in seconds, up to the camera's own maximum. 0 is
        sent to the camera driver as it is.
      required: true
      example: 120
      selector:
        number:
          min: 0
          step: "any"
          unit_of_measurement: s
          mode: box
    gain:
      name: Gain
      description: >-
        Camera gain override (optional), from 1 up to the camera's own
        maximum. Omit to use the camera's default gain; the API cannot set 0.
      example: 100
      selector:
        number:
          min: 1
          mode: box
    save:
      name: Save to Disk
      description: Whether to save the captured image to disk.
      default: false
      selector:
        boolean:

camera_abort_capture:
  name: Abort Capture
  description: Abort the current camera exposure immediately.
  target:
    entity:
      integration: nina_astrophotography

mount_slew:
  name: Slew Mount
  description: Slew the telescope mount to J2000 RA/Dec coordinates, in degrees.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    ra_degrees:
      name: Right Ascension
      description: Target J2000 RA in decimal degrees (0–360).
      required: true
      example: 83.822
      selector:
        number:
          min: 0
          max: 360
          step: "any"
          unit_of_measurement: "°"
          mode: box
    dec_degrees:
      name: Declination
      description: Target J2000 Dec in decimal degrees (−90 to +90).
      required: true
      example: -5.3911
      selector:
        number:
          min: -90
          max: 90
          step: "any"
          unit_of_measurement: "°"
          mode: box

mount_park:
  name: Park Mount
  description: Send the telescope mount to its park position.
  target:
    entity:
      integration: nina_astrophotography

mount_unpark:
  name: Unpark Mount
  description: Unpark the telescope mount.
  target:
    entity:
      integration: nina_astrophotography

mount_set_tracking:
  name: Set Tracking
  description: Enable or disable sidereal tracking.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    enabled:
      name: Tracking Enabled
      description: On to track at the sidereal rate, off to stop tracking.
      required: true
      selector:
        boolean:

focuser_move:
  name: Move Focuser
  description: Move the focuser to an absolute step position.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    position:
      name: Position
      description: >-
        Absolute focuser position in steps, from 0 up to the focuser's own
        maximum.
      required: true
      example: 25000
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: steps

focuser_auto_focus:
  name: Auto Focus
  description: Trigger an autofocus routine using the configured method.
  target:
    entity:
      integration: nina_astrophotography

filterwheel_change_filter:
  name: Change Filter
  description: Rotate the filter wheel to the specified filter slot.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    filter_index:
      name: Filter Index
      description: >-
        Zero-based index of the target filter slot, one the filter wheel
        reports.
      required: true
      example: 0
      selector:
        number:
          min: 0
          mode: box

flat_panel_set_cover:
  name: Set Flat Panel Cover
  description: Open or close the flat panel's cover.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    open:
      name: Open
      description: On to open the cover, off to close it.
      required: true
      selector:
        boolean:

flat_panel_set_light:
  name: Set Flat Panel Light
  description: >-
    Switch the flat panel's light on or off. It comes on at the brightness
    given, else at the level it is already lit at, else at its dimmest; never
    at full output. Refused while the panel reports no brightness range.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    light_on:
      name: Light On
      description: On to light the panel, off to switch it off.
      required: true
      selector:
        boolean:
    brightness:
      name: Brightness
      description: >-
        The level to light the panel at, in the panel's own units: above its
        minimum, which an ASCOM panel reads as off, and up to its maximum, such
        as 255 or 4096. Only when switching on.
      example: 1024
      selector:
        number:
          min: 0
          mode: box

flat_panel_set_brightness:
  name: Set Flat Panel Brightness
  description: >-
    Set the flat panel's brightness. An ASCOM panel lights at any level above
    0 and switches off at 0; other drivers leave the light as it is.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    level:
      name: Level
      description: >-
        Brightness in the panel's own units, within its own range, such as 0
        to 255 or 0 to 4096.
      required: true
      example: 1024
      selector:
        number:
          min: 0
          mode: box

guider_start:
  name: Start Guiding
  description: Start the autoguider.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    force_calibration:
      name: Force Calibration
      description: Force a new calibration run before guiding begins.
      default: false
      selector:
        boolean:

guider_stop:
  name: Stop Guiding
  description: Stop the autoguider.
  target:
    entity:
      integration: nina_astrophotography

rotator_move:
  name: Move Rotator
  description: >-
    Rotate to a sky position angle. Refused until a plate solve has synced the
    rotator. On a half or quarter range, N.I.N.A. turns to the equivalent angle
    within it.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    position:
      name: Position
      description: Target sky position angle in degrees, from 0 to 360.
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 360
          step: "any"
          unit_of_measurement: "°"
          mode: box

rotator_move_mechanical:
  name: Move Rotator (Mechanical)
  description: >-
    Rotate to a mechanical angle, the rotator's own, whatever the sky angle.
    Refused outside the rotator's range in N.I.N.A.'s profile.
  target:
    entity:
      integration: nina_astrophotography
  fields:
    position:
      name: Mechanical Position
      description: >-
        Target mechanical angle in degrees, from 0 to 360 and within the
        rotator's range.
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 360
          step: "any"
          unit_of_measurement: "°"
          mode: box

dome_open:
  name: Open Dome
  description: Open the dome shutter. Refused while the safety monitor reports unsafe.
  target:
    entity:
      integration: nina_astrophotography

dome_close:
  name: Close Dome
  description: Close the dome shutter.
  target:
    entity:
      integration: nina_astrophotography

dome_park:
  name: Park Dome
  description: Park the dome.
  target:
    entity:
      integration: nina_astrophotography

sequence_start:
  name: Start Sequence
  description: Start the currently loaded imaging sequence.
  target:
    entity:
      integration: nina_astrophotography

sequence_stop:
  name: Stop Sequence
  description: Stop the currently running sequence.
  target:
    entity:
      integration: nina_astrophotography

sequence_load:
  name: Load Sequence
  description: Load a sequence by name (does not start it).
  target:
    entity:
      integration: nina_astrophotography
  fields:
    sequence_name:
      name: Sequence Name
      description: >-
        The sequence's name as N.I.N.A. lists it, without the .ninasequence
        extension. Not a path.
      required: true
      example: "M42"
      selector:
        text:

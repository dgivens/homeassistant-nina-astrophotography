# The quality-scale register, in the form Home Assistant reads it. Hassfest
# validates this file for core integrations only, so nothing checks it here:
# mark a rule done only once it is.
#
# Bronze and Silver are recorded in full. Gold and Platinum list only the rules
# decided; the rest are covered by §10's "not pursued".
# `docs/v2.0-design.md` §10 is the same register with a pointer to the section
# that implements each rule; keep the two in step.
#
# An exemption carries its reason, so it does not read as unimplemented.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      The interval is fixed at 10 s, a backstop to the push socket.
  brands:
    status: done
    comment: >-
      Served from the integration's own `brand/` directory, which Home
      Assistant and HACS both read; there is no home-assistant/brands entry.
  common-modules: done
  config-flow:
    status: done
    comment: >-
      The form asks for an instance name besides host and port. The Advanced
      API reports no name for the rig, and the name prefixes every entity id
      and tells two rigs apart.
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      The integration has no external dependencies: `requirements` in
      manifest.json is empty.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration registers no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: >-
      The integration registers no triggers. Automations key on the
      `nina_<event>` bus events, which the README documents.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Entities go unavailable once the outage grace period has passed: 30 s by
      default, 0 to 300 in the options. Until then they hold their last
      readings, and the Reachable sensor turns off at the first missed poll.
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: >-
      The poll logs an outage and its recovery once each, but the outage at
      `warning` where the rule asks for `info`, and beside the coordinator's
      own "Error fetching" line. The event socket logs a warning on every
      failed reconnect while the rig is down, every 5 s backing off to 60 s.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      The supported 2.2.x Advanced API plugin has no authentication of any
      kind, so there are no credentials to re-enter. The 3.0 pre-release adds
      optional authentication, which this integration does not support.
  test-coverage:
    status: todo
    comment: >-
      Coverage is deliberately uneven — 100% on the config flow, high on the
      mapper and the pure modules, no global gate. `scripts/coverage_floors.py`
      enforces the per-file floors.

  # Gold
  devices: done
  dynamic-devices: done
  entity-category: done
  entity-disabled-by-default: done
  stale-devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: The Advanced API advertises no discovery protocol.
  repair-issues: todo

  # Platinum
  strict-typing: todo

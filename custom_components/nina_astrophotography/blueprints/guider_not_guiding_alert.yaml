blueprint:
  name: "N.I.N.A. – Guider Not Guiding Alert"
  description: >
    Notifies when lights are being saved while the guider runs without
    guiding: the guide star lost, or PHD2 looping, paused or calibrating. The
    guiding quality alert cannot see this, since guide RMS reads unknown
    whenever PHD2 is not guiding.

    It alerts once the guider has not guided for the time below, and a light
    has been saved since it stopped, while the sequence runs with the guider
    switch on, and with no meridian flip and no sequence wait under way. Those
    stop and restart guiding on purpose, and a guider N.I.N.A. stopped keeps
    reading `LostLock` with the switch off. It is checked as each light is
    saved, and when the guider status has lasted the time below.

    The time runs from when guide RMS turned unknown, so a lock lost, looping
    and lost again counts as one stretch, and from the guider switch turning
    on, if later. It repeats at most once per cooldown while the guider stays
    off guide; a new stretch alerts at once.

    To image unguided on purpose, disconnect the guider in N.I.N.A.
  domain: automation
  author: dgivens
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        guider_status:
          name: Guider status
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        guider_rms:
          name: Total guiding RMS
          description: Unknown from when PHD2 stops guiding until it guides again.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        guider_switch:
          name: Guider switch
          selector:
            entity:
              integration: nina_astrophotography
              domain: switch
        last_image_hfr:
          name: Last image HFR
          description: Its recent lights say when each light was saved.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        sequencer_running:
          name: Sequencer running
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        meridian_flip:
          name: Meridian flip
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        sequence_waiting:
          name: Sequence waiting
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor

    settings:
      name: Settings
      icon: mdi:cog
      input:
        not_guiding_minutes:
          name: Not guiding for
          description: >
            How long the guider may run without guiding first: longer than
            PHD2 takes to find a lost star again, or to loop while guiding
            restarts.
          default: 3
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: min
        cooldown_minutes:
          name: Cooldown between alerts
          default: 15
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: min
        notify_target:
          name: Notify
          selector:
            entity:
              domain: notify
              multiple: true

# Nothing waits, so a run never outlasts its trigger; the cooldown is a
# condition on the last alert instead of a delay.
mode: single
max_exceeded: silent

variables:
  guider_status: !input guider_status
  guider_rms: !input guider_rms
  guider_switch: !input guider_switch
  last_image_hfr: !input last_image_hfr
  sequencer_running: !input sequencer_running
  meridian_flip: !input meridian_flip
  sequence_waiting: !input sequence_waiting
  not_guiding_minutes: !input not_guiding_minutes
  cooldown_minutes: !input cooldown_minutes
  # When the guider last stopped guiding, as a timestamp.
  stopped_guiding: >-
    {% set status = states[guider_status] %}
    {% set rms = states[guider_rms] %}
    {% set on_switch = states[guider_switch] %}
    {% if status is none %}{{ none }}
    {% elif rms is not none and rms.state == 'unknown' %}
    {{ as_timestamp(([rms.last_changed]
       + ([on_switch.last_changed] if on_switch is not none else [])) | max) }}
    {% else %}{{ as_timestamp(status.last_changed) }}{% endif %}
  newest_light: >-
    {% set newest = (state_attr(last_image_hfr, 'recent_lights') or [])
       | list | last | default(none) %}
    {{ as_timestamp(newest.date, none) if newest is not none else none }}

triggers:
  - trigger: state
    entity_id: !input last_image_hfr
    attribute: recent_lights
  - trigger: state
    entity_id: !input guider_status
    to: ["LostLock", "Looping", "Paused", "Calibrating"]
    for:
      minutes: !input not_guiding_minutes

conditions:
  - condition: state
    entity_id: !input guider_status
    state: ["LostLock", "Looping", "Paused", "Calibrating"]
  - condition: state
    entity_id: !input guider_switch
    state: "on"
  - condition: state
    entity_id: !input sequencer_running
    state: "on"
  - condition: not
    conditions:
      - condition: state
        entity_id: !input meridian_flip
        state: "on"
      - condition: state
        entity_id: !input sequence_waiting
        state: "on"
  - alias: "Not guiding for long enough, and a light saved since"
    condition: template
    value_template: >
      {{ stopped_guiding is number and newest_light is number
         and newest_light > stopped_guiding
         and as_timestamp(now()) - stopped_guiding >= not_guiding_minutes * 60 }}
  - alias: "No alert yet for this stretch inside the cooldown"
    condition: template
    value_template: >
      {% set last = this.attributes.last_triggered %}
      {{ last is none or as_timestamp(last) < stopped_guiding
         or as_timestamp(now()) - as_timestamp(last) >= cooldown_minutes * 60 }}
  - alias: "The entities name the same rig"
    condition: template
    value_template: >
      {% set ns = namespace(entries=[]) %}
      {% for entity in [guider_status, guider_rms, guider_switch, last_image_hfr,
                        sequencer_running, meridian_flip, sequence_waiting] %}
        {% set entry = config_entry_id(entity) %}
        {% if entry is not none and entry not in ns.entries %}
          {% set ns.entries = ns.entries + [entry] %}
        {% endif %}
      {% endfor %}
      {{ ns.entries | count <= 1 }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: "⚠️ Guider not guiding"
      # One indent throughout: a folded scalar keeps the line breaks around a
      # more-indented line.
      message: >
        {%- set status = states(guider_status) %}
        {%- if status == 'LostLock' %}The guide star has been lost
        {%- elif status == 'Looping' %}The guider has been looping, not guiding,
        {%- elif status == 'Paused' %}The guider has been paused
        {%- else %}The guider has been calibrating{% endif %} for
        {{ ((as_timestamp(now()) - stopped_guiding) / 60) | round | int }}
        minutes, and lights are still being saved: they are unguided.

blueprint:
  name: "N.I.N.A. – Guider Not Guiding Alert"
  description: >
    Notifies when lights are being saved while the guider is not guiding: the
    guide star lost, PHD2 looping, paused or calibrating, or guiding stopped,
    as when the guide camera drops out. The guiding quality alert cannot see
    this, since guide RMS reads unknown whenever PHD2 is not guiding.

    It alerts once the guider has not guided for the time below, and a light
    exposed wholly since it stopped has been saved, while the sequence runs,
    with no meridian flip and no sequence wait under way: those stop and
    restart guiding on purpose. An autofocus run or a plate solve exposes
    without saving a light, so neither alerts on its own. It is checked as
    each light is saved, and once guide RMS has read unknown for the time
    below.

    It names the status it reads. `LostLock` is either a lost guide star or
    what a stop leaves behind, such as guiding that never restarted after an
    autofocus run: the guider status cannot tell them apart.

    The time runs from when guide RMS turned unknown, so a lock lost, looping
    and lost again counts as one stretch, and guiding again ends it. It
    repeats at most once per cooldown while the guider stays off guide; a new
    stretch alerts at once.

    To image unguided on purpose, disconnect the guider in N.I.N.A.
  domain: automation
  author: dgivens
  homeassistant:
    min_version: "2024.10.0"
  input:
    rig:
      name: Rig
      icon: mdi:telescope
      input:
        guider_status:
          name: Guider status
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        guider_rms:
          name: Total guiding RMS
          description: Unknown from when PHD2 stops guiding until it guides again.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        last_image_hfr:
          name: Last image HFR
          description: Its recent lights say when each light was saved.
          selector:
            entity:
              integration: nina_astrophotography
              domain: sensor
        sequencer_running:
          name: Sequencer running
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        meridian_flip:
          name: Meridian flip
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor
        sequence_waiting:
          name: Sequence waiting
          selector:
            entity:
              integration: nina_astrophotography
              domain: binary_sensor

    settings:
      name: Settings
      icon: mdi:cog
      input:
        not_guiding_minutes:
          name: Not guiding for
          description: >
            How long the guider may go without guiding first: longer than PHD2
            takes to find a lost star again, or to loop while guiding restarts.
          default: 3
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: min
        cooldown_minutes:
          name: Cooldown between alerts
          default: 15
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: min
        notify_target:
          name: Notify
          selector:
            entity:
              domain: notify
              multiple: true

# Nothing waits, so a run never outlasts its trigger; the cooldown is a
# condition on the last alert instead of a delay.
mode: single
max_exceeded: silent

variables:
  guider_status: !input guider_status
  guider_rms: !input guider_rms
  last_image_hfr: !input last_image_hfr
  sequencer_running: !input sequencer_running
  meridian_flip: !input meridian_flip
  sequence_waiting: !input sequence_waiting
  not_guiding_minutes: !input not_guiding_minutes
  cooldown_minutes: !input cooldown_minutes
  # When the guider last stopped guiding, as a timestamp: RMS turning
  # unknown, or the status changing where there is no RMS reading to go by.
  stopped_guiding: >-
    {% set status = states[guider_status] %}
    {% set rms = states[guider_rms] %}
    {% if rms is not none and rms.state == 'unknown' %}
    {{ as_timestamp(rms.last_changed) }}
    {% elif status is not none %}{{ as_timestamp(status.last_changed) }}
    {% else %}{{ none }}{% endif %}
  # When the newest light began exposing: N.I.N.A. stops guiding seconds after
  # saving a light, and the rig's clock need not agree with Home Assistant's,
  # so its save time is too close to a stop to compare.
  light_began: >-
    {% set newest = (state_attr(last_image_hfr, 'recent_lights') or [])
       | list | last | default(none) %}
    {% set saved = as_timestamp(newest.date, none) if newest is not none else none %}
    {{ saved - (newest.exposure or 0) if saved is not none else none }}

# Timed on RMS, which defines the stretch and is written after the status in
# the same read; on the status only for a rig with no RMS reading.
triggers:
  - trigger: state
    entity_id: !input last_image_hfr
    attribute: recent_lights
  - trigger: state
    entity_id: !input guider_rms
    to: "unknown"
    for:
      minutes: !input not_guiding_minutes
  - trigger: state
    entity_id: !input guider_status
    to: ["LostLock", "Looping", "Selected", "Paused", "Calibrating", "Stopped"]
    for:
      minutes: !input not_guiding_minutes

conditions:
  - condition: state
    entity_id: !input guider_status
    state: ["LostLock", "Looping", "Selected", "Paused", "Calibrating", "Stopped"]
  - condition: state
    entity_id: !input sequencer_running
    state: "on"
  - condition: not
    conditions:
      - condition: state
        entity_id: !input meridian_flip
        state: "on"
      - condition: state
        entity_id: !input sequence_waiting
        state: "on"
  - alias: "Not guiding for long enough, and a light begun since saved"
    condition: template
    value_template: >
      {{ stopped_guiding is number and light_began is number
         and light_began > stopped_guiding
         and as_timestamp(now()) - stopped_guiding >= not_guiding_minutes * 60 }}
  - alias: "No alert yet for this stretch inside the cooldown"
    condition: template
    value_template: >
      {% set last = this.attributes.last_triggered %}
      {{ last is none or as_timestamp(last) < stopped_guiding
         or as_timestamp(now()) - as_timestamp(last) >= cooldown_minutes * 60 }}
  - alias: "The entities name the same rig"
    condition: template
    value_template: >
      {% set ns = namespace(entries=[]) %}
      {% for entity in [guider_status, guider_rms, last_image_hfr,
                        sequencer_running, meridian_flip, sequence_waiting] %}
        {% set entry = config_entry_id(entity) %}
        {% if entry is not none and entry not in ns.entries %}
          {% set ns.entries = ns.entries + [entry] %}
        {% endif %}
      {% endfor %}
      {{ ns.entries | count <= 1 }}

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: "⚠️ Guider not guiding"
      # One indent throughout: a folded scalar keeps the line breaks around a
      # more-indented line. Run by hand, the guider may be guiding.
      message: >
        {%- set status = states(guider_status) %}
        {%- if status in ['LostLock', 'Looping', 'Selected', 'Paused',
        'Calibrating', 'Stopped'] %}The guider has not guided
        {%- if stopped_guiding is number %} for
        {{ ((as_timestamp(now()) - stopped_guiding) / 60) | round | int }}
        minutes{% endif %}, and reads {{ status }}: lights are being saved
        unguided.
        {%- else %}The guider reads {{ status }}.{% endif %}

<!doctype html>
<!--
  Render one card's scenarios side by side, for a look or a screenshot.

    python3 -m http.server 8901 --directory .        # from the repo root
    open http://127.0.0.1:8901/tools/card-harness/render.html?card=nina-sky-map-card

  Served rather than opened as a file: the card is an ES module and imports
  another one, which a `file://` origin refuses.

  A real browser, so this is the only thing here that exercises layout, fonts,
  `<canvas>` for real and the shadow DOM. `ops.mjs` says two versions agree;
  this is what says either one looks right.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>N.I.N.A. card harness</title>
    <style>
      body {
        background: #0f0f18;
        margin: 0;
        padding: 16px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        font-family: Roboto, system-ui, sans-serif;
      }
      .slot { width: 380px; }
      .cap { color: #8a8aa0; font: 12px ui-monospace, monospace; margin-bottom: 6px; }
      .err { color: #ff6b6b; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const card = params.get("card") ?? "nina-sky-map-card";
      const base = "../../";

      const [dump, { scenarios }] = await Promise.all([
        fetch(`${base}tests/ha/snapshots/card_states.json`).then((r) => r.json()),
        import(`./scenarios/${card}.mjs`),
      ]);
      await import(`${base}custom_components/nina_astrophotography/www/${card}.js`);

      // Collected rather than thrown: one scenario that fails to render must
      // not take the rest of the page with it.
      window.__errors = [];
      addEventListener("error", (event) => window.__errors.push(String(event.message)));

      const only = params.get("scenario");
      for (const [name, scenario] of Object.entries(scenarios)) {
        if (only && only !== name) continue;
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.innerHTML = `<div class="cap">${name}</div>`;
        document.body.appendChild(slot);
        try {
          const element = document.createElement(card);
          element.setConfig(scenario.config ?? {});
          slot.appendChild(element);
          const hass = scenario.hass(dump);
          // `auth/sign_path`, answered with the path unsigned: the image panel
          // then asks this server for its frames, which it does not have.
          hass.callWS = async ({ path }) => ({ path });
          element.hass = hass;
        } catch (error) {
          const shown = document.createElement("div");
          shown.className = "err";
          shown.textContent = String(error.stack ?? error);
          slot.appendChild(shown);
          window.__errors.push(String(error));
        }
      }
      document.title = `${card} — ${window.__errors.length} errors`;
    </script>
  </body>
</html>
